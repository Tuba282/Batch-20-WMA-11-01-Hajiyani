<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Marksheet Table</title>
    <style>
      /* General Layout Styles */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .marksheet-container {
        background-color: #ffffff;
        width: 100%;
        max-width: 800px;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 25px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Student Info Section */
      .student-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 30px;
        padding: 15px;
        background-color: #f8f9fa;
        border-left: 5px solid #3498db;
        border-radius: 4px;
      }

      .info-item {
        font-size: 15px;
        color: #555;
      }

      .info-item strong {
        color: #2c3e50;
      }

      /* Marksheet Table Styling */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      th,
      td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #e0e0e0;
      }

      thead th {
        background-color: #2c3e50;
        color: #ffffff;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 13px;
      }

      tbody tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      tbody tr:hover {
        background-color: #f1f1f1;
      }

      /* Highlight Totals Row */
      .total-row {
        background-color: #eaeded !important;
        font-weight: bold;
        border-top: 2px solid #2c3e50;
      }

      .total-row td {
        color: #2c3e50;
      }

      /* Status Badges */
      .badge {
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
      }

      .badge-pass {
        background-color: #e8f8f5;
        color: #27ae60;
      }

      .badge-fail {
        background-color: #fce4d6;
        color: #e74c3c;
      }

      /* Summary Footer Box */
      .summary-box {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background-color: #eaf2f8;
        border-radius: 6px;
      }

      .result-status {
        font-size: 18px;
        font-weight: bold;
      }

      .pass-text {
        color: #27ae60;
      }
    </style>
  </head>
  <body>
    
    <script src="./app.js"></script>
  </body>
</html>
