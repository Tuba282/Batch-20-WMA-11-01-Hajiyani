<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafe Street</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container-xxl border">
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-body-secondary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="./Assets/logo_coffe.jpg" alt="logo_coffe">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="#">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Our Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Delivery</a>
            </li>
          </ul>
          <form class="d-flex position-relative" role="search">
            <img src="./Assets/akar-icons_search.png" class="position-absolute navSearch" alt="akar-icons_search">
            <input class="form-control me-2 rounded-pill ps-5 w-75" type="search" placeholder="Search"
              aria-label="Search" />
            <img src="./Assets/icons_cart.png" width="" height="" alt="">
          </form>
        </div>
      </div>
    </nav>
    <!-- heroSection -->
    <div class="row flex-lg-row-reverse align-items-center g-5 py-5">
      <div class="col-10 col-lg-8">
        <img src="./Assets/img-hero.png" class="d-block mx-lg-auto img-fluid" alt="Bootstrap Themes" width="700"
          height="500" loading="lazy">
      </div>
      <div class="col-lg-4">
        <h1 class="display-5 fw-bold text-body-emphasis lh-1 mb-3">Enjoy your <span style="color: var(--orange);">coffee</span>  before your activity</h1>
        <p class="lead">Boost your productivity and build your mood with a glass of coffee in the morning </p>
        <div class="d-grid gap-2 d-md-flex justify-content-md-start"> <button type="button"
            class="btn btn-lg px-4 me-md-2">Primary</button> <button type="button"
            class="btn btn-outline-secondary btn-lg px-4">Default</button> </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
